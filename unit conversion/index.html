<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>OmniConvert Pro — Smart Universal Unit & Currency Converter</title>
    <meta name="title" content="OmniConvert Pro — Smart Universal Unit & Currency Converter" />
    <meta
      name="description"
      content="Instant bi-directional unit and currency conversion with natural language omnibox, voice control, multi-unit simultaneous view, batch CSV export, and live exchange rates."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OmniConvert Pro — Universal Unit & Currency Converter" />
    <meta
      property="og:description"
      content="High-precision conversion suite with over 16 categories, natural language query, live exchange rates, and offline PWA support."
    />

    <!-- Web App Manifest for PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6366f1" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured Data Schema Markup -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "OmniConvert Pro",
        "category": "UtilityApplication",
        "operatingSystem": "All",
        "applicationCategory": "Calculator",
        "description": "Universal Unit & Currency Converter with Natural Language search, live currency rates, and multi-unit grid output."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
